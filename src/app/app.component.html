<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <div class="header__container container">
      <nav class="header__nav">
        <img src="/assets/company-logo.svg" alt="Логотип компании" class="header__logo">
        <ul class="header__nav-list">
          <li class="header__nav-item"><a href="" class="header__nav-item-link">Главная</a></li>
          <li class="header__nav-item"><a href="" class="header__nav-item-link">О компании</a></li>
          <li class="header__nav-item"><a href="" class="header__nav-item-link">Каталог</a></li>
        </ul>
      </nav>
      <div class="header__right-block">
        <a href="tel:+7 (965) 084-29-29" class="header__phone-number-info">
          <img src="/assets/phone-image.svg" alt="" class="header__phone-image">
          +7 (965) 084-29-29
        </a>
        <button class="header__product-liked">
          <img src="assets/like-image.svg" alt="" class="header__product-liked-logo">
        </button>
        <button class="header__cart">
          <img src="assets/cart-image.svg" alt="" class="header__cart-logo">
          <span class="header__cart-product-volume">Пусто</span>
        </button>
      </div>
    </div>
  </header>

  <section class="nav-catalog">
    <div class="nav-catalog__container container">
      <div class="nav-catalog__menu menu">
        <button class="menu__menu-item menu__catalog-button">
          <img src="assets/burger-nav-button-icon.svg" alt="" class="menu__burger-image">
          <img src="/assets/close-button-icon.svg" alt="" class="menu__close-image hidden">
          <span>Каталог</span>
        </button>
        <button class="menu__menu-item">
          Стройматериалы
        </button>
        <button class="menu__menu-item">
          Инструменты
        </button>
        <button class="menu__menu-item">
          Электрика
        </button>
        <button class="menu__menu-item">
          Интерьер и отделка
        </button>
      </div>
      <div class="nav-catalog__right-block">
        <form class="nav-catalog__search" action="">
          <input type="text" class="nav-catalog__search-input" placeholder="Поиск, например, Круг зачистной" type="search">
          <button class="nav-catalog__search-button">
          </button>
        </form>
        <button class="nav-catalog__location">
          <span>Москва</span>
        </button>
      </div>
    </div>
  </section>
</body>

</html>
